      { id: 't5', no: 5, Item: "Taging De Taging - Source Data: Prep", target: 10, satuan: "-", bobot: 6 }

    ];



    const monthsList = ['JANUARI', 'FEBRUARI', 'MARET', 'APRIL', 'MEI', 'JUNI', 'JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DESEMBER'];

    const yearsList = ['2024', '2025', '2026', '2027', '2028', '2029', '2030'];



    // --- HELPER LOGIC ---

    const checkHasRawData = (staff, selectedMonth, selectedYear, importedData) => {

      if (!Array.isArray(importedData)) return false;

      return importedData.some(d => 

        (d.ID_Staff === staff.ID_Staff || d.Nama === staff.Nama) && 

        String(d.Bulan || 'JANUARI').toUpperCase() === String(selectedMonth).toUpperCase() &&

        String(d.Tahun || '2026') === String(selectedYear)

      );

    };



    const calculateMasaKerja = (tglMasuk) => {

      if (!tglMasuk || tglMasuk === '-') return '-';

      let parsedDate = tglMasuk;

      if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}$/.test(tglMasuk)) {

        const parts = tglMasuk.split(/[\/\-]/);

        parsedDate = `${parts[2]}-${parts[1]}-${parts[0]}`; 

      } else {

        const bulanIdToEn = {

          'januari': 'January', 'jan': 'Jan', 'februari': 'February', 'feb': 'Feb',

          'maret': 'March', 'mar': 'Mar', 'april': 'April', 'apr': 'Apr', 'mei': 'May',

          'juni': 'June', 'jun': 'Jun', 'juli': 'July', 'jul': 'Jul',

          'agustus': 'August', 'agt': 'Aug', 'agu': 'Aug', 'september': 'September', 'sep': 'Sep',

          'oktober': 'October', 'okt': 'Oct', 'november': 'November', 'nov': 'Nov',

          'desember': 'December', 'des': 'Dec'

        };

        for (const [id, en] of Object.entries(bulanIdToEn)) {

            parsedDate = parsedDate.replace(new RegExp(`\\b${id}\\b`, 'gi'), en);

        }

      }

      const startDate = new Date(parsedDate);

      if (isNaN(startDate.getTime())) return '-';

      

      const today = new Date();

      let years = today.getFullYear() - startDate.getFullYear();

      let months = today.getMonth() - startDate.getMonth();

      if (months < 0) { years--; months += 12; }

      

      let result = [];

      if (years > 0) result.push(`${years} Tahun`);

      if (months > 0) result.push(`${months} Bulan`);

      return result.length > 0 ? result.join(' ') : '< 1 Bulan';

    };



    // Helper untuk mengecek apakah suatu bulan & tahun berada di dalam range [start, end]

    const isMonthInRange = (month, year, startMonth, startYear, endMonth, endYear) => {

      const startVal = parseInt(startYear) * 12 + monthsList.indexOf(startMonth.toUpperCase());

      const endVal = parseInt(endYear) * 12 + monthsList.indexOf(endMonth.toUpperCase());

      const currentVal = parseInt(year) * 12 + monthsList.indexOf(month.toUpperCase());

      

      const minVal = Math.min(startVal, endVal);

      const maxVal = Math.max(startVal, endVal);

      

      return currentVal >= minVal && currentVal <= maxVal;

    };



    const getMonthsInRangeList = (startMonth, startYear, endMonth, endYear) => {

      const startVal = parseInt(startYear) * 12 + monthsList.indexOf(startMonth.toUpperCase());

      const endVal = parseInt(endYear) * 12 + monthsList.indexOf(endMonth.toUpperCase());

      

      const minVal = Math.min(startVal, endVal);

      const maxVal = Math.max(startVal, endVal);

      

      let list = [];

      for (let v = minVal; v <= maxVal; v++) {

        const y = Math.floor(v / 12);

        const m = monthsList[v % 12];

        list.push({ month: m, year: y.toString() });

      }

      return list;

    };



    const calculateDataForStaffRange = (staff, startMonth, startYear, endMonth, endYear, importedData) => {

      const monthsInRange = getMonthsInRangeList(startMonth, startYear, endMonth, endYear);

      const activeKpiStruct = String(staff.Tipe_KPI).includes('2') ? kpiStructureTipe2 : kpiStructureTipe1;



      let aggregatedKpi = {};

      let aggregatedSubj = {};

      let aggregatedTpm = {};



      activeKpiStruct.forEach(g => g.items.forEach(i => aggregatedKpi[i.id] = { pencapaianValues: [], skorSum: 0, count: 0, isAutoFilled: false }));

      subyektifStructure.forEach(i => aggregatedSubj[i.id] = { pencapaianValues: [], skorSum: 0, count: 0, isAutoFilled: false });

      tpmStructure.forEach(i => aggregatedTpm[i.id] = { pencapaianValues: [], skorSum: 0, count: 0, isAutoFilled: false });



      let monthsWithDataCount = 0;



      monthsInRange.forEach(({ month, year }) => {

        const hasData = checkHasRawData(staff, month, year, importedData);

        if (hasData) {

          monthsWithDataCount++;

          const singleMonthData = calculateDataForStaff(staff, month, year, importedData);



          Object.keys(singleMonthData.newKpi).forEach(id => {

            const item = singleMonthData.newKpi[id];

            if (item.pencapaian !== '' && item.pencapaian !== null) {

              aggregatedKpi[id].pencapaianValues.push(parseFloat(item.pencapaian) || 0);

              aggregatedKpi[id].skorSum += (parseFloat(item.skor) || 0);

              aggregatedKpi[id].count++;

              if (item.isAutoFilled) aggregatedKpi[id].isAutoFilled = true;

            }

          });



          Object.keys(singleMonthData.newSubj).forEach(id => {

            const item = singleMonthData.newSubj[id];

            if (item.pencapaian !== '' && item.pencapaian !== null) {

              aggregatedSubj[id].pencapaianValues.push(parseFloat(item.pencapaian) || 0);

              aggregatedSubj[id].skorSum += (parseFloat(item.skor) || 0);

              aggregatedSubj[id].count++;

              if (item.isAutoFilled) aggregatedSubj[id].isAutoFilled = true;

            }

          });



          Object.keys(singleMonthData.newTpm).forEach(id => {

            const item = singleMonthData.newTpm[id];

            if (item.pencapaian !== '' && item.pencapaian !== null) {

              aggregatedTpm[id].pencapaianValues.push(parseFloat(item.pencapaian) || 0);

              aggregatedTpm[id].skorSum += (parseFloat(item.skor) || 0);

              aggregatedTpm[id].count++;

              if (item.isAutoFilled) aggregatedTpm[id].isAutoFilled = true;

            }

          });

        }

      });



      let finalKpi = {};

      let finalSubj = {};

      let finalTpm = {};



      Object.keys(aggregatedKpi).forEach(id => {

        const item = aggregatedKpi[id];

        const avgPencapaian = item.pencapaianValues.length > 0 ? (item.pencapaianValues.reduce((a, b) => a + b, 0) / item.pencapaianValues.length).toFixed(2) : '';

        const avgSkor = item.count > 0 ? (item.skorSum / item.count).toFixed(2) : 0;

        finalKpi[id] = { pencapaian: avgPencapaian, skor: avgSkor, isAutoFilled: item.isAutoFilled };

      });



      Object.keys(aggregatedSubj).forEach(id => {

        const item = aggregatedSubj[id];

        const avgPencapaian = item.pencapaianValues.length > 0 ? (item.pencapaianValues.reduce((a, b) => a + b, 0) / item.pencapaianValues.length).toFixed(2) : '';

        const avgSkor = item.count > 0 ? (item.skorSum / item.count).toFixed(2) : 0;

        finalSubj[id] = { pencapaian: avgPencapaian, skor: avgSkor, isAutoFilled: item.isAutoFilled };

      });



      Object.keys(aggregatedTpm).forEach(id => {

        const item = aggregatedTpm[id];

        const avgPencapaian = item.pencapaianValues.length > 0 ? (item.pencapaianValues.reduce((a, b) => a + b, 0) / item.pencapaianValues.length).toFixed(2) : '';

        const avgSkor = item.count > 0 ? (item.skorSum / item.count).toFixed(2) : 0;

        finalTpm[id] = { pencapaian: avgPencapaian, skor: avgSkor, isAutoFilled: item.isAutoFilled };

      });



      return { newKpi: finalKpi, newSubj: finalSubj, newTpm: finalTpm, monthsWithDataCount };

    };



    const calculateDataForStaff = (staff, targetMonth, targetYear, importedData) => {

      let newKpi = {}; let newSubj = {}; let newTpm = {};

      const activeKpiStruct = String(staff.Tipe_KPI).includes('2') ? kpiStructureTipe2 : kpiStructureTipe1;

      

      activeKpiStruct.forEach(g => g.items.forEach(i => newKpi[i.id] = { pencapaian: '', skor: 0, isAutoFilled: false }));

      subyektifStructure.forEach(i => newSubj[i.id] = { pencapaian: '', skor: 0, isAutoFilled: false });

      tpmStructure.forEach(i => newTpm[i.id] = { pencapaian: '', skor: 0, isAutoFilled: false });



      let staffRawData = null;

      if (Array.isArray(importedData)) {

          const found = importedData.find(d => 

            (d.ID_Staff === staff.ID_Staff || d.Nama === staff.Nama) && 

            String(d.Bulan || 'JANUARI').toUpperCase() === String(targetMonth).toUpperCase() &&

            String(d.Tahun || '2026') === String(targetYear)

          );

          if(found) staffRawData = { ...found };

      }



      if(staffRawData) {

          const isTipe2 = String(staff.Tipe_KPI).includes('2');

          

          if (staffRawData['Stock_WIP_Ton'] !== undefined && staffRawData['Stock_WIP_Ton'] !== "") {

              if (parseFloat(staffRawData['Stock_WIP_Ton']) > 1000) {

                 staffRawData['Stock_WIP_Ton'] = (parseFloat(staffRawData['Stock_WIP_Ton']) / 1000).toString();

              }

          }

          if (staffRawData['Stock_Gudang_Ton'] !== undefined && staffRawData['Stock_Gudang_Ton'] !== "") {

              if (parseFloat(staffRawData['Stock_Gudang_Ton']) > 1000) {

                 staffRawData['Stock_Gudang_Ton'] = (parseFloat(staffRawData['Stock_Gudang_Ton']) / 1000).toString();

              }

          }



          const fillKpi = (rawKey, targetId1, targetId2, targetValue, maxBobot1, maxBobot2, operator = '<=') => {

              if (staffRawData[rawKey] !== undefined && staffRawData[rawKey] !== "") {

                  const targetId = isTipe2 ? targetId2 : targetId1;

                  if (!targetId) return; 

                  

                  const maxBobot = isTipe2 ? maxBobot2 : maxBobot1;

                  let calculatedScore = 0;

                  

                  if (operator === '<=') {

                      if (val <= targetValue) calculatedScore = maxBobot;

                      else calculatedScore = targetValue === 0 ? 0 : (targetValue / val) * maxBobot;

                  } else if (operator === '>=') {

                      if (val >= targetValue) calculatedScore = maxBobot;

                      else calculatedScore = targetValue === 0 ? maxBobot : (val / targetValue) * maxBobot;

                  }

                  calculatedScore = Number(Math.max(0, calculatedScore).toFixed(2));

                  if (newKpi[targetId]) newKpi[targetId] = { pencapaian: val.toString(), skor: calculatedScore, isAutoFilled: true };

          fillKpi('Tunggu_Pakan_Weaving', 't1_4_2', null, 0, 10, 0, '<=');

          fillKpi('Percobaan_RND', 't1_7_1', 't2_4_1', 2, 2, 2, '>=');

          fillKpi('RND_Tepat_Waktu', 't1_7_2', 't2_4_2', 90, 2, 2, '>=');

          fillKpi('Tunggu_Sulur', 't1_8_1', 't2_5_1', 0, 5, 10, '<=');

          fillKpi('Biaya_Lembur_Persen', 't1_9_1', 't2_6_1', 10, 2, 3, '<=');

          fillKpi('Total_Waste_Persen', 't1_10_1', 't2_7_1', 0.3, 5, 5, '<=');

          fillKpi('Jumlah_Training', 't1_11_1', 't2_8_1', 1, 2, 2, '>=');

          fillKpi('Rata_Waktu_Training', null, 't2_8_2', 1, 0, 1, '>=');

          fillKpi('Kecelakaan_Kerja', 't1_12_1', 't2_9_1', 0, 2, 2, '<=');

          fillKpi('Kehadiran_Persen', 't1_13_1', 't2_10_1', 97.0, 2, 5, '>=');

          fillKpi('Kehadiran_Meeting', null, 't2_11_2', 100, 0, 2, '>=');

          fillKpi('Breakdown_Mesin', null, 't2_12_1', 0, 0, 2, '<=');

          

          if (staffRawData['Pembuatan_OPL'] !== undefined && staffRawData['Pembuatan_OPL'] !== "") {

              const valOpl = parseFloat(staffRawData['Pembuatan_OPL']);

              const targetId = isTipe2 ? 't2_11_1' : 't1_14_1';

              const maxBobot = isTipe2 ? 5 : 2;

              const target = isTipe2 ? 1 : 3;

              let calculatedScore = valOpl >= target ? maxBobot : (valOpl / target) * maxBobot;

              calculatedScore = Number(Math.max(0, calculatedScore).toFixed(2));

              if(newKpi[targetId]) newKpi[targetId] = { pencapaian: valOpl.toString(), skor: calculatedScore, isAutoFilled: true };

          }



          const fillSubj = (rawKey, targetId) => {

              if (staffRawData[rawKey] !== undefined && staffRawData[rawKey] !== "") {

                  const val = parseFloat(staffRawData[rawKey]);

                  if (newSubj[targetId]) newSubj[targetId] = { pencapaian: val.toString(), skor: val, isAutoFilled: true };

              }

          };



          fillSubj('Subj_Job_Enrichment', 's1');

          fillSubj('Subj_Human_Relation', 's2');

          fillSubj('Subj_Personal_Improvement', 's3');

          fillSubj('Subj_Achievement_Motivation', 's4');



          const fillTpm = (rawKey, targetId, targetValue, maxBobot, operator = '<=') => {

              if (staffRawData[rawKey] !== undefined && staffRawData[rawKey] !== "") {

                  const val = parseFloat(staffRawData[rawKey]);

                  let calculatedScore = 0;

                  if (operator === '<=') {

                      if (val <= targetValue) calculatedScore = maxBobot;

                      else calculatedScore = targetValue === 0 ? 0 : (targetValue / val) * maxBobot;

                  } else if (operator === '>=') {

                      if (val >= targetValue) calculatedScore = maxBobot;

                      else calculatedScore = targetValue === 0 ? maxBobot : (val / targetValue) * maxBobot;

                  }

                  calculatedScore = Number(Math.max(0, calculatedScore).toFixed(2));

                  if (newTpm[targetId]) newTpm[targetId] = { pencapaian: val.toString(), skor: calculatedScore, isAutoFilled: true };

              }

          };



          fillTpm('TPM_OEE', 't1', 85, 6, '>=');

          fillTpm('TPM_FMEA', 't2', 100, 6, '>=');

          fillTpm('TPM_Jobdesc', 't3', 100, 6, '>=');

          fillTpm('TPM_Kontribusi', 't4', 10, 6, '>=');

          fillTpm('TPM_Taging', 't5', 10, 6, '>=');

      }

      return { newKpi, newSubj, newTpm };

    };



    // --- COMPONENTS ---

                          </Fragment>

                        ))}

                        <tr className="subheader-gray font-bold">

                          <td colSpan={7} className="px-2 py-1.5 text-center uppercase tracking-widest text-[11px] border border-black">Total</td>

                          <td className="text-center text-[11px] border border-black">100,00</td><td className="bg-slate-400 border border-black"></td><td className="text-center text-blue-800 text-[13px] border border-black">{totalKpiSkor.toFixed(2).replace('.', ',')}</td>

                        </tr>

                      </tbody>

                    </table>



                    {/* SECTION 2: PENILAIAN SUBYEKTIF */}

                    <table className="doc-table text-[10px] mb-4 w-full">

                      <thead>

                        <tr className="subheader-gray font-bold text-xs"><td className="text-center w-8">2</td><td colSpan={5} className="uppercase">Penilaian Subyektif</td></tr>

                        <tr className="subheader-gray font-bold text-center uppercase leading-tight">

                          <th rowSpan={2} className="w-8">NO</th><th rowSpan={2} className="">Item</th><th rowSpan={2} className="w-[10%]">BOBOT</th><th colSpan={2} className="">{shortColHeaderLabel}</th>

                        </tr>

                        <tr className="subheader-gray font-bold text-center uppercase text-[9px]"><th className="py-1 w-[15%] border-black">PENCAPAIAN</th><th className="py-1 w-[10%] border-black">SKOR</th></tr>

                      </thead>

                      <tbody>

                        {subyektifStructure.map(item => (

                          <tr key={item.id} className="hover:bg-slate-50">

                            <td className="text-center py-1.5">{item.no}</td><td className="px-2 font-semibold uppercase">{item.Item}</td><td className="text-center font-bold">{item.bobot}</td>

                            <td className={`p-0 relative border border-black ${subjData[item.id]?.isAutoFilled ? 'autofill-bg' : 'bg-white'}`}>

                              {subjData[item.id]?.isAutoFilled && <i className="fa-solid fa-link absolute top-1.5 right-1 text-[8px] text-green-600 print:hidden opacity-50" title="Data Otomatis dari Spreadsheet"></i>}

                              <InputCell disabled={currentUser?.role !== 'admin'} align="center" isAutoFilled={subjData[item.id]?.isAutoFilled} value={subjData[item.id]?.pencapaian} onChange={(v) => handleDataChange(setSubjData, item.id, 'pencapaian', v)} />

                            </td>

                            <td className={`p-0 border border-black ${subjData[item.id]?.isAutoFilled ? 'autofill-bg' : 'bg-white'}`}>

                              <InputCell type="text" disabled={currentUser?.role !== 'admin'} align="center" isBold isAutoFilled={subjData[item.id]?.isAutoFilled} value={subjData[item.id]?.skor} onChange={(v) => handleDataChange(setSubjData, item.id, 'skor', v)} />

                            </td>

                          </tr>

                        ))}

                        <tr className="subheader-gray font-bold text-center">

                          <td colSpan={2} className="py-1.5 uppercase tracking-widest text-[11px] border border-black">Total</td>

                          <td className="text-[11px] border border-black">20</td><td className="bg-slate-400 border border-black"></td><td className="text-blue-800 text-[13px] border border-black">{totalSubjSkor.toFixed(2).replace('.', ',')}</td>

                        </tr>

                      </tbody>

                    </table>



                    {/* SECTION 3: TPM */}

                    <table className="doc-table text-[10px] mb-4 w-full">

                      <thead>

                        <tr className="subheader-gray font-bold text-xs"><td className="text-center w-8">3</td><td colSpan={7} className="uppercase">TPM</td></tr>

                        <tr className="subheader-gray font-bold text-center uppercase leading-tight">

                          <th rowSpan={2} className="w-8">NO</th><th rowSpan={2} className="">Item</th><th rowSpan={2} className="w-[8%]">TARGET</th><th rowSpan={2} className="w-[8%]">SATUAN</th><th rowSpan={2} className="w-[8%]">BOBOT</th><th colSpan={2} className="">{shortColHeaderLabel}</th>

                        </tr>

                        <tr className="subheader-gray font-bold text-center uppercase text-[9px]"><th className="py-1 w-[15%] border-black">PENCAPAIAN</th><th className="py-1 w-[10%] border-black">SKOR</th></tr>

                      </thead>

                      <tbody>

                        {tpmStructure.map(item => (

                          <tr key={item.id} className="hover:bg-slate-50">

                            <td className="text-center py-1.5">{item.no}</td><td className="px-2 uppercase">{item.Item}</td><td className="text-center font-semibold">{item.target}</td><td className="text-center">{item.satuan}</td><td className="text-center font-bold">{item.bobot}</td>

                            <td className={`p-0 relative border border-black ${tpmData[item.id]?.isAutoFilled ? 'autofill-bg' : 'bg-white'}`}>

                              {tpmData[item.id]?.isAutoFilled && <i className="fa-solid fa-link absolute top-1.5 right-1 text-[8px] text-green-600 print:hidden opacity-50" title="Data Otomatis dari Spreadsheet"></i>}

                              <InputCell disabled={currentUser?.role !== 'admin'} align="center" isAutoFilled={tpmData[item.id]?.isAutoFilled} value={tpmData[item.id]?.pencapaian} onChange={(v) => handleDataChange(setTpmData, item.id, 'pencapaian', v)} />

                            </td>

                            <td className={`p-0 border border-black ${tpmData[item.id]?.isAutoFilled ? 'autofill-bg' : 'bg-white'}`}>

                              <InputCell type="text" disabled={currentUser?.role !== 'admin'} align="center" isBold isAutoFilled={tpmData[item.id]?.isAutoFilled} value={tpmData[item.id]?.skor} onChange={(v) => handleDataChange(setTpmData, item.id, 'skor', v)} />

                            </td>

                          </tr>

                        ))}

                        <tr className="subheader-gray font-bold text-center">

                          <td colSpan={4} className="py-1.5 uppercase tracking-widest text-[11px] border border-black">Total</td>

                          <td className="text-[11px] border border-black">30</td><td className="bg-slate-400 border border-black"></td><td className="text-blue-800 text-[13px] border border-black">{totalTpmSkor.toFixed(2).replace('.', ',')}</td>

                        </tr>

                      </tbody>

                    </table>



                    {/* GRAND TOTAL SECTION */}

                    <table className="doc-table text-[11px] font-bold mt-2 w-full">

                      <tbody>

                        <tr className="subheader-gray">

                          <td colSpan={5} className="px-4 py-2 text-center uppercase tracking-widest text-[13px]">Total Skor Akhir</td>

                          <td colSpan={2} className="px-2 py-1 text-center uppercase border-black">{displayRangePeriodText}</td>

                        </tr>

                        <tr className="text-center bg-white">

                          <td colSpan={5} className="px-4 py-4 text-[10px] font-normal italic text-slate-500">

                            *Rumus Perhitungan: (Total Skor KPI x 50%) + Total Skor Subyektif + Total Skor TPM

                          </td>

                          <td className="px-2 w-[15%] text-center text-3xl text-blue-700 border-black">{grandTotal.toFixed(2).replace('.', ',')}</td>

                          <td className={`px-2 w-[15%] text-center text-4xl font-black border-black ${category === 'A' ? 'text-green-600' : category === 'D' || category === '-' ? 'text-red-600' : 'text-blue-600'}`}>{category}</td>

                        </tr>

                        <tr className="header-gray text-[10px] text-center">

                          <td colSpan={5} className="py-1 border-black"></td><td className="py-1 uppercase tracking-wider border-black">Skor Total</td><td className="py-1 uppercase tracking-wider border-black">Kategori</td>

                        </tr>

                      </tbody>

                    </table>



                    {/* SIGNATURES */}

                    <table className="doc-table mt-6 text-xs font-bold text-center w-full">

                      <tbody>

                        <tr className="header-gray">

                          <td className="py-2 w-1/2 border-black">PENILAI 1</td>

                          <td className="py-2 w-1/2 border-black">PENILAI 2</td>

                        </tr>

                        <tr>

                          <td className="h-24 p-2 text-left align-top font-normal border-black">Tgl:</td>

                          <td className="h-24 p-2 text-left align-top font-normal border-black">Tgl:</td>

                        </tr>

                      </tbody>

                    </table>

                  </div>

                </div>

              </div>

            )}

          </div>

        </div>

      );

    };



    const root = ReactDOM.createRoot(document.getElementById('root'));

    root.render(<App />);

  </script>
